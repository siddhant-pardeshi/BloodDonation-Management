name: Keep-warm ping

# Pings the LifeDrop API every 5 minutes so the free-tier Render
# service stays warm and visitors never hit a cold start.
# Best-effort by design: a ping that times out during a redeploy
# must not mark the repository red.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        continue-on-error: true
        run: curl -fsS --max-time 90 https://lifedrop-backend-zjl5.onrender.com/api/v1/donors/count
