# =============================================================
# Blood Donation Management - Application Configuration
# =============================================================

# ---- Server Configuration ----
# Cloud platforms (Render, etc.) assign the port via the PORT env var
server.port=${PORT:8080}

# Session cookie settings — needed so the React app (port 5173)
# can share the session cookie with the backend (port 8080)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# ---- MySQL DataSource Configuration ----
spring.datasource.url=jdbc:mysql://localhost:3306/blood_donation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Configuration ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ---- Logging Configuration ----
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ---- Application Custom Properties ----
app.cors.allowed-origins=http://localhost:5173
app.donation.eligibility.days=90
