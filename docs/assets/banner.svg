<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="LifeDrop — Blood Donation Management System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a100c"/>
      <stop offset="0.45" stop-color="#7a1f15"/>
      <stop offset="1" stop-color="#2e0a07"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b5e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff6b5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3ab"/>
      <stop offset="1" stop-color="#ff8a80"/>
    </linearGradient>
    <style>
      .beat {
        animation: beat 1.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.14); }
        28% { transform: scale(1); }
        42% { transform: scale(1.09); }
        56% { transform: scale(1); }
      }
      .ecg-pulse {
        stroke-dasharray: 300 2300;
        animation: sweep 5s linear infinite;
      }
      @keyframes sweep {
        from { stroke-dashoffset: 2600; }
        to { stroke-dashoffset: 0; }
      }
      .fall {
        animation: fall 6s linear infinite;
      }
      @keyframes fall {
        0% { transform: translateY(-50px); opacity: 0; }
        12% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      .cell {
        animation: drift 9s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(26px, -20px) scale(1.15); }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- floating red blood cells -->
  <g fill="#e74c3c" opacity="0.16">
    <circle class="cell" cx="960" cy="60" r="24"/>
    <circle class="cell" cx="1080" cy="200" r="30" style="animation-delay:-3s"/>
    <circle class="cell" cx="880" cy="240" r="18" style="animation-delay:-5s"/>
    <circle class="cell" cx="70" cy="250" r="22" style="animation-delay:-2s"/>
    <circle class="cell" cx="320" cy="40" r="16" style="animation-delay:-6s"/>
  </g>
  <g fill="#ffffff" opacity="0.05">
    <circle class="cell" cx="1010" cy="120" r="40" style="animation-delay:-4s"/>
    <circle class="cell" cx="160" cy="120" r="34" style="animation-delay:-1s"/>
  </g>

  <!-- falling blood drops -->
  <g fill="url(#dropGrad)">
    <path class="fall" transform="translate(240,0)" d="M0,0 C5,10 8,16 8,21 A8,8 0 1,1 -8,21 C-8,16 -5,10 0,0"/>
    <path class="fall" transform="translate(420,0)" d="M0,0 C4,8 6,13 6,17 A6,6 0 1,1 -6,17 C-6,13 -4,8 0,0" style="animation-delay:-2.5s"/>
    <path class="fall" transform="translate(760,0)" d="M0,0 C5,10 8,16 8,21 A8,8 0 1,1 -8,21 C-8,16 -5,10 0,0" style="animation-delay:-4s"/>
    <path class="fall" transform="translate(1120,0)" d="M0,0 C4,8 6,13 6,17 A6,6 0 1,1 -6,17 C-6,13 -4,8 0,0" style="animation-delay:-1.2s"/>
    <path class="fall" transform="translate(940,0)" d="M0,0 C4,8 6,13 6,17 A6,6 0 1,1 -6,17 C-6,13 -4,8 0,0" style="animation-delay:-5.2s"/>
  </g>

  <!-- ECG trace across the banner -->
  <path
    d="M0,150 L40,150 L46,140 L52,150 L62,150 L68,164 L76,84 L84,178 L92,150 L110,150 L122,128 L134,150 L160,150 L200,150 L206,140 L212,150 L222,150 L228,164 L236,84 L244,178 L252,150 L270,150 L282,128 L294,150 L320,150 L360,150 L366,140 L372,150 L382,150 L388,164 L396,84 L404,178 L412,150 L430,150 L442,128 L454,150 L480,150 L520,150 L526,140 L532,150 L542,150 L548,164 L556,84 L564,178 L572,150 L590,150 L602,128 L614,150 L640,150 L680,150 L686,140 L692,150 L702,150 L708,164 L716,84 L724,178 L732,150 L750,150 L762,128 L774,150 L800,150 L840,150 L846,140 L852,150 L862,150 L868,164 L876,84 L884,178 L892,150 L910,150 L922,128 L934,150 L960,150 L1000,150 L1006,140 L1012,150 L1022,150 L1028,164 L1036,84 L1044,178 L1052,150 L1070,150 L1082,128 L1094,150 L1120,150 L1200,150"
    fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path
    class="ecg-pulse"
    d="M0,150 L40,150 L46,140 L52,150 L62,150 L68,164 L76,84 L84,178 L92,150 L110,150 L122,128 L134,150 L160,150 L200,150 L206,140 L212,150 L222,150 L228,164 L236,84 L244,178 L252,150 L270,150 L282,128 L294,150 L320,150 L360,150 L366,140 L372,150 L382,150 L388,164 L396,84 L404,178 L412,150 L430,150 L442,128 L454,150 L480,150 L520,150 L526,140 L532,150 L542,150 L548,164 L556,84 L564,178 L572,150 L590,150 L602,128 L614,150 L640,150 L680,150 L686,140 L692,150 L702,150 L708,164 L716,84 L724,178 L732,150 L750,150 L762,128 L774,150 L800,150 L840,150 L846,140 L852,150 L862,150 L868,164 L876,84 L884,178 L892,150 L910,150 L922,128 L934,150 L960,150 L1000,150 L1006,140 L1012,150 L1022,150 L1028,164 L1036,84 L1044,178 L1052,150 L1070,150 L1082,128 L1094,150 L1120,150 L1200,150"
    fill="none" stroke="#ff8a80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px rgba(255,138,128,0.9))"/>

  <!-- glowing beating heart -->
  <circle cx="185" cy="150" r="105" fill="url(#glow)"/>
  <g class="beat">
    <path transform="translate(185,148) scale(2.6)"
      d="M0,26 C-3,18 -30,4 -30,-12 C-30,-24 -20,-30 -11,-30 C-4,-30 0,-25 0,-21 C0,-25 4,-30 11,-30 C20,-30 30,-24 30,-12 C30,4 3,18 0,26 Z"
      fill="url(#heartGrad)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <!-- ECG line through the heart -->
    <path transform="translate(185,148) scale(2.6)"
      d="M-24,0 L-10,0 L-7,-4 L-4,6 L0,-14 L4,8 L7,0 L24,0"
      fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff">LifeDrop</text>
  <text x="334" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#ffd9d0">Blood Donation Management System</text>
  <text x="334" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ffffff" fill-opacity="0.72">React  •  Spring Boot  •  MySQL  •  Connecting donors, hospitals &amp; blood camps</text>
</svg>
